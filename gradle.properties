# Memoria do processo que compila.
#
# Ja foi 1024m por necessidade: o JDK que o Bubblewrap baixou era de 32 bits
# ("emulated-client") e nao reservava mais que isso, por mais RAM que a maquina
# tivesse. Com o JDK 21 de 64 bits do Android Studio o teto sai da frente, e o
# Compose agradece — o compilador dele e faminto.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX e obrigatorio; as bibliotecas de suporte antigas nao existem mais.
android.useAndroidX=true
kotlin.code.style=official

# Gera apenas os recursos que o app declara, em vez de todos os das bibliotecas.
android.nonTransitiveRClass=true

# Sincronizacao paralela do Gradle (adicionado pelo Android Studio).
org.gradle.tooling.parallel=true
